<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buyesi Youth Verified: Staff</title>
<style>
:root{--bg:#f7f6f1;--surface:#fff;--ink:#17231c;--muted:#5d6b62;--line:#d9dcd3;--brand:#14442f;--brand-ink:#fff;--sun:#f2b705;--ok:#14663f;--bad:#a3261c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--surface:#18231d;--ink:#eef2ec;--muted:#9bab9f;--line:#2b3b32;--brand:#7fd3a4;--brand-ink:#0f1713;--ok:#7fd3a4;--bad:#ff8a7e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:1.2rem;margin:0 0 10px}
.bar{height:6px;background:linear-gradient(90deg,var(--brand) 70%,var(--sun) 70%);border-radius:3px;margin-bottom:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:6px}
.btn{margin-top:16px;background:var(--brand);color:var(--brand-ink);border:0;padding:11px 18px;font-weight:700}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line);margin-left:8px}
.muted{color:var(--muted)}.err{color:var(--bad);margin:10px 0 0}
.cert{border:2px solid var(--brand);border-radius:6px;padding:22px;background:var(--surface);text-align:center}
.cert .who{font-size:1.7rem;font-weight:800;margin:6px 0}
.cert img{width:170px;height:170px;margin-top:10px}
.small{font-size:.85rem;word-break:break-all}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border:0}
.tag{font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.tag.anchored{color:var(--ok);border-color:var(--ok)}.tag.failed{color:var(--bad);border-color:var(--bad)}
[hidden]{display:none!important}
@media print{body *{visibility:hidden}#card,#card *{visibility:visible}#card{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<main>
<div class="bar"></div>
<h1>Buyesi Youth Verified</h1>
<p class="muted">Staff screen for issuing certificates.</p>

<section id="login" class="panel">
  <h2>Staff sign in</h2>
  <label for="tok">Staff password</label>
  <input id="tok" type="password" autocomplete="current-password">
  <button class="btn" id="signin">Sign in</button>
  <p class="err" id="loginErr" hidden></p>
</section>

<div id="app" hidden>
  <section class="panel">
    <h2>Issue a certificate</h2>
    <label for="name">Full name</label><input id="name" autocomplete="off">
    <div class="row">
      <div><label for="prog">Programme</label>
        <select id="prog"><option>Tailoring</option><option>Farming and agribusiness</option><option>Coding and digital skills</option><option>Leadership</option><option>Community service</option></select></div>
      <div><label for="date">Completion date</label><input id="date" type="date"></div>
    </div>
    <label for="details">Details (optional)</label><textarea id="details" rows="2" placeholder="e.g. 12-week course, 40 hours"></textarea>
    <button class="btn" id="issue">Issue certificate</button>
    <p class="err" id="issueErr" hidden></p>
  </section>

  <section class="panel" id="result" hidden>
    <div class="cert" id="card">
      <p class="muted" style="margin:0">Buyesi Youth Initiative certifies that</p>
      <p class="who" id="rName"></p>
      <p style="margin:0">completed <b id="rProg"></b> on <span id="rDate"></span></p>
      <img id="rQr" alt="QR code to verify this certificate">
      <p class="small muted" style="margin-bottom:0">Verify at <span id="rUrl"></span></p>
      <p class="small muted" style="margin-top:2px">ID <span id="rId"></span></p>
    </div>
    <button class="btn" id="print">Print certificate</button>
    <button class="btn alt" id="copy">Copy verify link</button>
  </section>

  <section class="panel">
    <h2>Issued certificates</h2>
    <div id="list"></div>
    <button class="btn alt" id="retry" style="margin-left:0" hidden>Retry failed blockchain records</button>
  </section>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
let token = '';
try { token = sessionStorage.getItem('byv_token') || ''; } catch (e) {}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')');
  return j;
}
function showErr(id, msg) { const e = $(id); e.textContent = msg; e.hidden = !msg; }

async function loadList() {
  const rows = await api('/api/certificates');
  $('list').innerHTML = rows.length ? rows.map(r =>
    `<div class="rec"><div><b>${esc(r.name)}</b><br><span class="muted small">${esc(r.programme)} · ${esc(r.id)}</span></div>
     <div><a href="/v/${esc(r.id)}" target="_blank" rel="noopener">Verify</a> <span class="tag ${esc(r.status)}">${esc(r.status)}</span></div></div>`).join('')
    : '<p class="muted">No certificates yet. Issue the first one above.</p>';
  $('retry').hidden = !rows.some(r => r.status !== 'anchored');
}
async function enter() {
  await loadList();
  $('login').hidden = true; $('app').hidden = false;
  $('date').valueAsDate = new Date();
}
$('signin').onclick = async () => {
  token = $('tok').value;
  try { await enter(); try { sessionStorage.setItem('byv_token', token); } catch (e) {} showErr('loginErr', ''); }
  catch (e) { showErr('loginErr', e.message); }
};
$('issue').onclick = async () => {
  const name = $('name').value.trim(), completed = $('date').value;
  if (!name || !completed) return showErr('issueErr', 'Enter a name and completion date.');
  $('issue').disabled = true;
  try {
    const body = JSON.stringify({ name, programme: $('prog').value, completed, details: $('details').value.trim() });
    const r = await api('/api/certificates', { method: 'POST', body });
    $('rName').textContent = name; $('rProg').textContent = $('prog').value; $('rDate').textContent = completed;
    $('rQr').src = '/qr/' + r.id; $('rUrl').textContent = r.verifyUrl; $('rId').textContent = r.id;
    $('result').hidden = false; $('result').dataset.url = r.verifyUrl;
    $('name').value = ''; $('details').value = ''; showErr('issueErr', '');
    await loadList();
    $('result').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { showErr('issueErr', e.message); }
  $('issue').disabled = false;
};
$('print').onclick = () => window.print();
$('copy').onclick = () => { try { navigator.clipboard.writeText($('result').dataset.url); $('copy').textContent = 'Copied'; } catch (e) {} };
$('retry').onclick = async () => { await api('/api/retry', { method: 'POST' }); setTimeout(loadList, 4000); };
$('tok').addEventListener('keydown', e => { if (e.key === 'Enter') $('signin').click(); });
if (token) enter().catch(() => {});
</script>
</body>
</html>
